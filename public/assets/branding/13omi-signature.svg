<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#C8A45D" />
      <stop offset="50%" stop-color="#9C7838" />
      <stop offset="75%" stop-color="#E8C888" />
      <stop offset="100%" stop-color="#916E2E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 13OMI Signature Hand-drawn Calligraphy Contour -->
  <g filter="url(#goldGlow)">
    <!-- Number 1 -->
    <path d="M 28 85 L 42 28 L 52 32 L 40 85 Z" fill="url(#goldMetallic)" />
    <!-- Number 3 with aggressive street cuts -->
    <path d="M 58 30 C 72 26, 92 28, 92 45 C 92 56, 82 60, 72 62 C 86 64, 98 70, 96 85 C 94 98, 74 102, 54 98 L 58 86 C 70 89, 82 88, 83 80 C 84 72, 74 69, 62 70 L 64 58 C 74 58, 80 54, 79 43 C 78 37, 68 37, 59 39 Z" fill="url(#goldMetallic)" />
    <!-- Letter O (vinyl record inspired) -->
    <ellipse cx="132" cy="62" rx="28" ry="32" stroke="url(#goldMetallic)" stroke-width="9" />
    <circle cx="132" cy="62" r="6" fill="url(#goldMetallic)" />
    <!-- Letter M (sharp crown peaks) -->
    <path d="M 172 95 L 180 32 L 202 72 L 224 32 L 232 95 L 220 95 L 216 54 L 202 82 L 188 54 L 184 95 Z" fill="url(#goldMetallic)" />
    <!-- Letter I (stylized exclamation / street slash) -->
    <path d="M 248 30 L 260 30 L 254 84 L 242 84 Z" fill="url(#goldMetallic)" />
    <circle cx="249" cy="95" r="5" fill="url(#goldMetallic)" />
    <!-- Dynamic Street Art Underline flourish -->
    <path d="M 35 106 Q 140 115 285 96 Q 220 102 120 100 Q 60 99 35 106 Z" fill="url(#goldMetallic)" opacity="0.9" />
    <!-- Small star crown accent -->
    <path d="M 276 34 L 280 44 L 290 46 L 282 52 L 285 62 L 276 56 L 267 62 L 270 52 L 262 46 L 272 44 Z" fill="url(#goldMetallic)" />
  </g>
</svg>
