<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="auraElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#286BFF" />
      <stop offset="100%" stop-color="#713BFF" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="100%" stop-color="#C8A45D" />
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer diamond ring -->
  <path d="M 80 8 L 152 80 L 80 152 L 8 80 Z" stroke="url(#auraElectric)" stroke-width="2.5" opacity="0.6" />
  <circle cx="80" cy="80" r="62" stroke="#24262C" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Inner AURA soundwave crown -->
  <g filter="url(#auraGlow)">
    <!-- Stylized 'A' combined with equalizer bars -->
    <path d="M 80 24 L 118 126 L 98 126 L 89 100 L 71 100 L 62 126 L 42 126 Z M 80 58 L 74 88 L 86 88 Z" fill="url(#auraElectric)" />
    
    <!-- Equalizer core bars pulsing inside -->
    <rect x="52" y="70" width="4" height="24" rx="2" fill="url(#goldAccent)" />
    <rect x="62" y="60" width="4" height="34" rx="2" fill="url(#goldAccent)" />
    <rect x="94" y="60" width="4" height="34" rx="2" fill="url(#goldAccent)" />
    <rect x="104" y="70" width="4" height="24" rx="2" fill="url(#goldAccent)" />
  </g>

  <!-- 13OMI Crown Accent at apex -->
  <path d="M 72 16 L 80 6 L 88 16 L 84 16 L 80 10 L 76 16 Z" fill="url(#goldAccent)" />
</svg>
