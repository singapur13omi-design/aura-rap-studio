<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="auraElectricFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#286BFF" />
      <stop offset="100%" stop-color="#A24EFF" />
    </linearGradient>
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="goldSignature" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A45D" />
      <stop offset="50%" stop-color="#FFF2D6" />
      <stop offset="100%" stop-color="#C8A45D" />
    </linearGradient>
  </defs>

  <!-- Left Icon -->
  <g transform="translate(10, 10)">
    <path d="M 50 4 L 96 50 L 50 96 L 4 50 Z" stroke="url(#auraElectricFull)" stroke-width="2" opacity="0.8" />
    <path d="M 50 16 L 76 84 L 62 84 L 56 66 L 44 66 L 38 84 L 24 84 Z M 50 38 L 46 58 L 54 58 Z" fill="url(#auraElectricFull)" />
  </g>

  <!-- Main Wordmark: AURA RAP STUDIO -->
  <text x="125" y="62" font-family="'Bebas Neue', 'Oswald', 'Anton', sans-serif" font-size="54" font-weight="900" letter-spacing="4" fill="url(#chromeGradient)">
    AURA
  </text>
  
  <text x="250" y="62" font-family="'Bebas Neue', 'Oswald', 'Anton', sans-serif" font-size="54" font-weight="900" letter-spacing="4" fill="url(#auraElectricFull)">
    RAP
  </text>
  
  <text x="350" y="62" font-family="'Bebas Neue', 'Oswald', 'Anton', sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#FFFFFF">
    STUDIO
  </text>

  <!-- Subtitle Tagline & 13OMI Endorsement -->
  <text x="126" y="86" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#777C87">
    YOUR VOICE. YOUR FLOW. YOUR SOUND.
  </text>

  <g transform="translate(390, 72)">
    <line x1="0" y1="12" x2="30" y2="12" stroke="#24262C" stroke-width="1" />
    <text x="36" y="14" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="url(#goldSignature)">
      BY 13OMI
    </text>
  </g>
</svg>
