<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="turntableGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#713BFF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#08090C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08090C" />
    </radialGradient>
    <linearGradient id="vinylShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262C" />
      <stop offset="50%" stop-color="#0E1016" />
      <stop offset="100%" stop-color="#181B24" />
    </linearGradient>
    <linearGradient id="goldNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="100%" stop-color="#C8A45D" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#08090C" />
  <circle cx="280" cy="200" r="230" fill="url(#turntableGlow)" />

  <!-- Technics SL-1200 Style Turntable Deck -->
  <rect x="50" y="30" width="500" height="340" rx="16" fill="#111318" stroke="#24262C" stroke-width="2" />

  <!-- Vinyl Platter Base -->
  <circle cx="260" cy="200" r="150" fill="#181B24" stroke="#777C87" stroke-width="2" />
  <!-- Strobe Dots Ring -->
  <circle cx="260" cy="200" r="142" stroke="#C6CBD3" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.6" />

  <!-- Vinyl 12-inch Record Body -->
  <circle cx="260" cy="200" r="132" fill="url(#vinylShine)" stroke="#0E1016" stroke-width="3" />
  
  <!-- Vinyl Micro-grooves -->
  <circle cx="260" cy="200" r="122" stroke="#24262C" stroke-width="1" opacity="0.8" />
  <circle cx="260" cy="200" r="110" stroke="#24262C" stroke-width="1.5" opacity="0.6" />
  <circle cx="260" cy="200" r="98" stroke="#24262C" stroke-width="1" opacity="0.7" />
  <circle cx="260" cy="200" r="86" stroke="#24262C" stroke-width="1.2" opacity="0.8" />
  <circle cx="260" cy="200" r="74" stroke="#24262C" stroke-width="1" opacity="0.6" />
  <circle cx="260" cy="200" r="62" stroke="#24262C" stroke-width="1.5" opacity="0.7" />

  <!-- Center Vinyl Label (AURA / 13OMI Centerpiece) -->
  <circle cx="260" cy="200" r="44" fill="#713BFF" stroke="#C8A45D" stroke-width="2" />
  <circle cx="260" cy="200" r="40" fill="#08090C" />
  <circle cx="260" cy="200" r="8" fill="#C6CBD3" />
  <text x="260" y="196" font-family="'Bebas Neue', sans-serif" font-size="12" font-weight="900" fill="#C8A45D" text-anchor="middle" letter-spacing="2">
    13OMI
  </text>
  <text x="260" y="210" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700" fill="#C6CBD3" text-anchor="middle" letter-spacing="1">
    33⅓ RPM
  </text>

  <!-- DJ Tonearm & Cartridge -->
  <g transform="translate(450, 90)">
    <circle cx="0" cy="0" r="26" fill="#1E222D" stroke="#777C87" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0E1016" />
    <path d="M 0 0 L -60 110 L -125 150" stroke="url(#goldNeedle)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Headshell Cartridge on record -->
    <rect x="-142" y="142" width="22" height="12" rx="2" fill="#286BFF" stroke="#FFFFFF" stroke-width="1" transform="rotate(-30 -131 148)" />
  </g>

  <!-- Pitch Fader on right -->
  <g transform="translate(470, 240)">
    <rect x="0" y="0" width="10" height="90" rx="3" fill="#08090C" stroke="#24262C" stroke-width="1" />
    <line x1="5" y1="5" x2="5" y2="85" stroke="#777C87" stroke-width="1" />
    <rect x="-6" y="38" width="22" height="14" rx="2" fill="url(#goldNeedle)" stroke="#08090C" stroke-width="1" />
  </g>

  <!-- Typography Accent -->
  <text x="70" y="340" font-family="'Bebas Neue', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#C6CBD3">
    THE BEAT
  </text>
  <text x="70" y="358" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#A24EFF">
    DJING • TURNTABLISM • 808 SLAMS
  </text>
</svg>
