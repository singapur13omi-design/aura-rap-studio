<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="breakGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#286BFF" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#713BFF" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#08090C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#08090C" />
    </radialGradient>
    <linearGradient id="dancerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#286BFF" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#08090C" />
  <circle cx="300" cy="200" r="210" fill="url(#breakGlow)" />

  <!-- Underground Cypher Circle on the floor -->
  <ellipse cx="300" cy="310" rx="220" ry="45" stroke="#24262C" stroke-width="2" fill="#111318" fill-opacity="0.4" />
  <ellipse cx="300" cy="310" rx="160" ry="32" stroke="#286BFF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <ellipse cx="300" cy="310" rx="90" ry="18" stroke="#C8A45D" stroke-width="1" opacity="0.5" />

  <!-- Dynamic Energy Speedlines / Motion Trails -->
  <g opacity="0.35" stroke="#00E5FF" stroke-width="1.5">
    <path d="M 220 180 Q 250 120 340 100" stroke-dasharray="6 4" />
    <path d="M 180 230 Q 220 160 310 130" stroke-dasharray="8 5" />
    <path d="M 260 270 Q 340 240 420 170" stroke-dasharray="10 4" />
  </g>

  <!-- B-Boy Air Freeze Silhouette (One-hand balance, angular street geometry) -->
  <g transform="translate(300, 200)">
    <!-- Supporting Hand on concrete -->
    <rect x="-8" y="90" width="16" height="8" rx="2" fill="#C6CBD3" />
    <!-- Lower Supporting Arm -->
    <path d="M 0 90 L 10 35 L -15 -10" stroke="url(#dancerStroke)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Torso Inverted 45 deg -->
    <path d="M -15 -10 L 25 -45 L 50 -25 L 10 10 Z" fill="#181B24" stroke="url(#dancerStroke)" stroke-width="3" />
    
    <!-- Head / Beanie tilted down -->
    <circle cx="-35" cy="-20" r="16" fill="#111318" stroke="#C8A45D" stroke-width="2.5" />
    <!-- Beanie brim -->
    <rect x="-46" y="-12" width="22" height="6" rx="2" fill="#C8A45D" />

    <!-- Free Arm Flared Out in Air -->
    <path d="M 25 -45 L 85 -70 L 125 -40" stroke="url(#dancerStroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Legs Split in Iconic Freeze -->
    <!-- Leg 1 kicked skyward -->
    <path d="M 50 -25 L 100 -75 L 140 -125" stroke="url(#dancerStroke)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="135" y="-140" width="22" height="15" rx="3" fill="#286BFF" transform="rotate(-30 146 -132)" />

    <!-- Leg 2 hooked in counter-balance -->
    <path d="M 10 10 L 55 40 L 110 25" stroke="url(#dancerStroke)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="105" y="16" width="20" height="14" rx="3" fill="#C6CBD3" transform="rotate(15 115 23)" />
  </g>

  <!-- Concrete floor crack / street texture lines -->
  <path d="M 120 330 L 180 320 L 220 340" stroke="#777C87" stroke-width="1" opacity="0.4" />
  <path d="M 420 320 L 460 335 L 510 325" stroke="#777C87" stroke-width="1" opacity="0.4" />

  <!-- Typography Accent -->
  <text x="50" y="340" font-family="'Bebas Neue', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#C6CBD3">
    THE MOVEMENT
  </text>
  <text x="50" y="358" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#00E5FF">
    BREAKING • STREET BATTLES • FREEZES
  </text>
</svg>
