<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="micLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#286BFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#08090C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#08090C" />
    </radialGradient>
    <linearGradient id="chromeMic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#777C87" />
      <stop offset="100%" stop-color="#24262C" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#08090C" />
  <circle cx="300" cy="180" r="220" fill="url(#micLight)" />

  <!-- Acoustic Studio Grid Background -->
  <g opacity="0.15" stroke="#777C87" stroke-width="0.5">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- Sound Waves Emanating -->
  <circle cx="300" cy="170" r="85" stroke="#286BFF" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="300" cy="170" r="120" stroke="#713BFF" stroke-width="1.5" opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="300" cy="170" r="160" stroke="#00E5FF" stroke-width="1" opacity="0.2" />

  <!-- Professional Studio Microphone (Neumann Capsule Silhouette) -->
  <g transform="translate(300, 160)">
    <!-- Shockmount Ring -->
    <ellipse cx="0" cy="20" rx="65" ry="24" stroke="url(#chromeMic)" stroke-width="4" fill="none" opacity="0.8" />
    <ellipse cx="0" cy="20" rx="72" ry="28" stroke="#286BFF" stroke-width="1.5" fill="none" opacity="0.5" />
    <line x1="-60" y1="20" x2="60" y2="20" stroke="url(#chromeMic)" stroke-width="3" />

    <!-- Mic Body -->
    <rect x="-24" y="-30" width="48" height="95" rx="10" fill="#111318" stroke="url(#chromeMic)" stroke-width="3" />
    <!-- Mesh Grille -->
    <rect x="-22" y="-95" width="44" height="65" rx="12" fill="#181B24" stroke="url(#chromeMic)" stroke-width="3" />
    <!-- Grille Pattern Lines -->
    <line x1="-20" y1="-80" x2="20" y2="-80" stroke="#777C87" stroke-width="1" opacity="0.6" />
    <line x1="-20" y1="-65" x2="20" y2="-65" stroke="#777C87" stroke-width="1" opacity="0.6" />
    <line x1="-20" y1="-50" x2="20" y2="-50" stroke="#777C87" stroke-width="1" opacity="0.6" />
    <line x1="-20" y1="-35" x2="20" y2="-35" stroke="#777C87" stroke-width="1" opacity="0.6" />

    <!-- Pop Filter Ring -->
    <ellipse cx="-15" cy="-60" rx="35" ry="45" stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.4" />
    <line x1="-15" y1="-15" x2="-35" y2="80" stroke="#777C87" stroke-width="3" />

    <!-- Stand Stem -->
    <rect x="-6" y="65" width="12" height="150" fill="url(#chromeMic)" />
  </g>

  <!-- Typography Accent -->
  <text x="40" y="360" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" letter-spacing="4" fill="#C6CBD3">
    THE VOICE
  </text>
  <text x="40" y="380" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#286BFF">
    MCING • LYRICAL SOUL • CADENCE
  </text>
</svg>
